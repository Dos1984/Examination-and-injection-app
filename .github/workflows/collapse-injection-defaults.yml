name: Collapse injection headings by default
on:
  push:
    paths:
      - '.github/workflows/collapse-injection-defaults.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make all injection headings collapsed by default
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-landmark.js')
          s=p.read_text()
          old="""btn.setAttribute('aria-expanded', i === 0 ? 'true' : 'false');\n      btn.innerHTML = `<span>${h2.innerHTML}</span><span class=\"inj-chevron\" aria-hidden=\"true\">⌄</span>`;\n      h2.replaceWith(btn);\n      if (i !== 0) section.classList.add('collapsed');"""
          new="""btn.setAttribute('aria-expanded', 'false');\n      btn.innerHTML = `<span>${h2.innerHTML}</span><span class=\"inj-chevron\" aria-hidden=\"true\">⌄</span>`;\n      h2.replaceWith(btn);\n      section.classList.add('collapsed');"""
          if old not in s:
              raise SystemExit('Expected makeCollapsible default-open block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const VERSION = 'msk-v43';", "const VERSION = 'msk-v44';")
          s=s.replace('?v=43','?v=44')
          p.write_text(s)
          PY
      - name: Commit collapsed defaults
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-landmark.js sw.js
          git commit -m 'Collapse all injection headings by default v44'
          git push
