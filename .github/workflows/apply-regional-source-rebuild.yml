name: Apply regional source rebuild

on:
  push:
    paths:
      - 'tools/apply-regional-source-rebuild.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source rebuild
        run: python tools/apply-regional-source-rebuild.py
      - name: Commit rebuilt index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply regional source rebuild to index"
          git push
