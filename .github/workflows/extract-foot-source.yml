name: Extract Foot and Ankle source
on:
  push:
    paths:
      - 'tools/extract-foot-source.py'
      - '.github/workflows/extract-foot-source.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract source excerpt
        run: python tools/extract-foot-source.py
      - name: Commit excerpt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/foot-source-excerpt.txt
          git diff --cached --quiet || git commit -m 'Extract Foot and Ankle source excerpt'
          git push
